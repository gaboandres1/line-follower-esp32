<title>Panel mirobot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*CSS*/
/* --- solo para este render: marcos de teléfono y barra de simulación --- */
:root{--desk:#e3e6e0;--frame:#c9cdc6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#08090a;--frame:#2a2e33}}
:root[data-theme="dark"]{--desk:#08090a;--frame:#2a2e33}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans)}
.pv{max-width:900px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pv-head h1{margin:0;font-size:22px;letter-spacing:-.01em;text-wrap:balance}
.pv-head p{margin:6px 0 0;color:var(--mute);font-size:14px;max-width:62ch}
.pv-sim{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 20px}
.pv-sim span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-right:4px}
.pv-sim button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font:500 13px var(--sans);cursor:pointer}
.pv-sim button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pv-grid{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start}
.pv-col{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(392px,100%)}
.pv-url{font:12.5px var(--mono);color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px}
.phone{width:100%;max-width:392px;height:800px;overflow-y:auto;background:var(--bg);border:10px solid var(--frame);border-radius:42px;scrollbar-width:thin}
.phone .app{padding-top:22px}
@media (max-width:440px){.phone{height:auto;border-width:6px;border-radius:28px}}
</style>

<div class="pv">
  <header class="pv-head">
    <h1>Panel web de mirobot</h1>
    <p>Render de la interfaz que sirve el ESP32. Es el mismo HTML del firmware, conectado a un robot simulado: los sliders, el botón y las alertas funcionan.</p>
  </header>
  <div class="pv-sim" role="group" aria-label="Simulación">
    <span>Simular</span>
    <button type="button" id="sim-clp">Choque (CLP)</button>
    <button type="button" id="sim-near">Obstáculo (NEAR)</button>
    <button type="button" id="sim-lost">Línea perdida</button>
  </div>
<script>
/* Robot simulado: responde a las mismas rutas que el ESP32 (/api/...). */
(() => {
  const S = { run: 1, alarm: "none", kp: 45, ki: 0, kd: 120, base: 140, max: 210, line: 0,
    dirty: 0, lastChange: 0, lastSave: Date.now() - 95000, saves: 14, alarms: 0, lostEv: 2, runMs: 61000,
    t0: Date.now(), lastE: 0, integ: 0, lostUntil: 0, lastRun: Date.now() };
  const W = [-2, -1, 0, 1, 2], clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let snap = null;

  function step() {
    const now = Date.now(), t = (now - S.t0) / 1000;
    if (S.run) S.runMs += now - S.lastRun; S.lastRun = now;
    let x = S.run ? 1.35 * Math.sin(t * 1.05) + 0.45 * Math.sin(t * 3.1) : 0.3;
    if (now < S.lostUntil) x = 9;
    const on = W.map(w => Math.abs(w - x) < 0.7);
    const n = on.filter(Boolean).length;
    let e = n === 0 ? (S.lastE >= 0 ? 3 : -3) : n === 5 ? 0 : W.reduce((a, w, i) => a + (on[i] ? w : 0), 0) / n;
    let p = 0, i = 0, d = 0, u = 0, l = 0, r = 0;
    if (S.run) {
      S.integ = clamp(S.integ + e, -50, 50);
      p = S.kp * e; i = S.ki * S.integ; d = S.kd * (e - S.lastE); u = p + i + d;
      const mx = S.max, b = Math.min(S.base, mx);
      l = Math.round(clamp(b + u, -mx, mx)); r = Math.round(clamp(b - u, -mx, mx));
    }
    S.lastE = e;
    if (S.dirty && saveIn() === 0) { S.dirty = 0; S.saves++; S.lastSave = now; }
    const bits = on.map(v => (v ? "1" : "0")).join("");
    snap = { e, p, i, d, u, l, r, on: bits, raw: S.line ? bits.replace(/./g, c => (c === "1" ? "0" : "1")) : bits, count: n };
  }
  function saveIn() {
    if (!S.dirty) return 0;
    const now = Date.now();
    return Math.max(0, 3000 - (now - S.lastChange), 10000 - (now - S.lastSave));
  }
  function state() {
    return { name: "mirobot", ssid: "MiRobot", run: S.run, alarm: S.alarm, s: snap.on, e: snap.e, l: snap.l, r: snap.r,
      kp: S.kp, ki: S.ki, kd: S.kd, base: S.base, max: S.max, line: S.line, dirty: S.dirty, saveIn: saveIn() };
  }
  function metrics() {
    const now = Date.now();
    return { fw: "web-1.0", up: now - S.t0 + 734000, run: S.run, alarm: S.alarm, raw: snap.raw, on: snap.on, count: snap.count,
      err: snap.e, p: snap.p, i: snap.i, d: snap.d, u: snap.u, l: snap.l, r: snap.r, clp: S.alarm === "clp" ? 0 : 1,
      near: S.alarm === "near" ? 0 : 1, loop_hz: 99.6 + Math.random() * 0.8, exec_us: 38 + Math.round(Math.random() * 14),
      exec_max_us: 71 + Math.round(Math.random() * 20), lost_events: S.lostEv, alarms: S.alarms, run_ms: S.runMs,
      kp: S.kp, ki: S.ki, kd: S.kd, base: S.base, max: S.max, line: S.line, heap: 241380 - Math.round(Math.random() * 900),
      heap_min: 236912, clients: 1, ssid: "MiRobot", ip: "192.168.4.1", dns: "mirobot.com", saves: S.saves,
      dirty: S.dirty, last_save_s: Math.round((now - S.lastSave) / 1000) };
  }
  function raise(a) { S.run = 0; S.alarm = a; S.alarms++; if (a === "lost") { S.lostEv++; S.lostUntil = Date.now() + 1500; } }
  document.getElementById("sim-clp").onclick = () => raise("clp");
  document.getElementById("sim-near").onclick = () => raise("near");
  document.getElementById("sim-lost").onclick = () => raise("lost");

  window.fetch = async (url) => {
    const u = new URL(url, "http://mirobot.com"), q = u.searchParams;
    await new Promise(r => setTimeout(r, 25));
    step();
    let body;
    switch (u.pathname) {
      case "/api/set": {
        const k = q.get("k"), v = +q.get("v");
        const lim = { kp: [0, 150], ki: [0, 5], kd: [0, 400], base: [0, 255], max: [0, 255], line: [0, 1] }[k];
        if (lim) { S[k] = k === "base" || k === "max" || k === "line" ? Math.round(clamp(v, ...lim)) : clamp(v, ...lim); S.dirty = 1; S.lastChange = Date.now(); }
        body = state(); break;
      }
      case "/api/run":
        if (q.get("on") === "1") { if (S.alarm === "none" || S.alarm === "lost") { S.alarm = "none"; S.run = 1; S.integ = 0; } }
        else S.run = 0;
        body = state(); break;
      case "/api/ack": if (!S.run) S.alarm = "none"; body = state(); break;
      case "/api/reset": Object.assign(S, { kp: 45, ki: 0, kd: 120, base: 140, max: 210, line: 0, dirty: 0, lastSave: Date.now() }); S.saves++; body = state(); break;
      case "/api/metrics": body = metrics(); break;
      default: body = state();
    }
    return new Response(JSON.stringify(body), { headers: { "Content-Type": "application/json" } });
  };
  step();
  // En el render, los enlaces entre páginas llevan al otro teléfono
  document.addEventListener("click", ev => {
    const a = ev.target.closest("a"); if (!a) return;
    ev.preventDefault();
    const to = a.getAttribute("href") === "/" ? "frame-p" : "frame-m";
    document.getElementById(to).scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
})();
</script>
  <div class="pv-grid">
    <div class="pv-col"><div class="pv-url">http://mirobot.com</div><div class="phone" id="frame-p"><!--PANEL--></div></div>
    <div class="pv-col"><div class="pv-url">http://mirobot.com/metrics</div><div class="phone" id="frame-m"><!--METRICS--></div></div>
  </div>
</div>
